<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mypime Login</title>
<style>
body {
  margin:0;
  font-family: Arial, sans-serif;
  background: linear-gradient(#0f1c2e, #1b2d4a);
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
}

.container {
  background:#f9f9f9;
  padding:30px;
  border-radius:12px;
  box-shadow:0 5px 20px rgba(0,0,0,0.3);
  text-align:center;
  width:300px;
}

h1 {
  margin:0;
  font-size:24px;
  color:#333;
}

p {
  margin:8px 0 20px;
  font-size:14px;
  color:#666;
}

input {
  width:90%;
  padding:12px;
  margin:10px auto;
  border:1px solid #ccc;
  border-radius:6px;
  font-size:14px;
  display:block;
}

button {
  width:95%;
  padding:12px;
  margin-top:15px;
  border:none;
  border-radius:6px;
  background: linear-gradient(90deg,#ffd54f,#ff9800);
  color:white;
  font-size:15px;
  font-weight:bold;
  cursor:pointer;
}

button:hover {
  background: linear-gradient(90deg,#ff9800,#f57c00);
}

.small {
  margin-top:12px;
  font-size:12px;
  color:#666;
}
</style>
</head>
<body>

<div class="container">
  <h1>BIENVENIDO A MYPIME</h1>
  <p>Compra en línea desde la comodidad de tu hogar</p>
  <form>
    <input type="text" name="nombre" placeholder="Nombre" required>
    <input type="text" name="ciudad" placeholder="Ciudad" required>
    <button type="submit">Entrar</button>
  </form>
  <div class="small">¿Nuevo? Crea tu cuenta en segundos</div>
</div>

</body>
</html>
